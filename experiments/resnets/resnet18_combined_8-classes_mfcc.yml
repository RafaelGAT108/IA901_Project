# Experiment configuration for resnet18 on the combined dataset.

experiment: resenet18_combined_8-classes_mfcc-delta

# Callbacks
checkpoint_monitor: val_f1_macro
checkpoint_mode: max
early_stop_monitor: val_f1_macro
early_stop_mode: max
patience: 10

# Training
max_epochs: 100
precision: 16-mixed
seed: 42
batch_size: 32
num_workers: 4
sampler: null

# Model
model:
  name: resnet18
  architecture: cnn
  pretrained: null
  freeze_layers: false

# Optimization
criterion: CrossEntropyLoss
optimizer: AdamW
learning_rate: 0.0001
weight_decay: 0.00001
momentum: null
lr_scheduler: StepLR
step_size: 7
gamma: 0.1

# Data
dataset:
  name: combined
  classes:
    - Asthma
    - Bronchiectasis
    - Bronchiolitis
    - COPD
    - Healthy
    - Lung Fibrosis
    - Pneumonia
    - URTI
  num_channels: 1
  preprocess:
    - Window: {window_length: 5, hop_length: 5}
    - Resample: {target_sr: 22050}
    - NormalizeAudio: {}

# Transforms are read by LungSoundDataModule.get_transforms().
transforms:
  - MFCC: {n_fft: 2048, hop_length: 512, n_mfcc: 128}
